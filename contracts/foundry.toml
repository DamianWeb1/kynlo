[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules", "lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
