name: Format Kynlo Contracts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-contracts.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.6.0
        with:
          version: stable
          cache: true

      - name: Format Solidity
        working-directory: contracts
        run: forge fmt

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Format Kynlo Solidity with forge fmt'
          git push origin main
